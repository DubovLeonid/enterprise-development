name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore packages
        run: dotnet restore Salon.slnx

      - name: Build
        run: dotnet build Salon.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Salon.slnx --configuration Release --no-build
